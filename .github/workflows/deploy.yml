name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # ThinkingFlow AI質問機能のfeature flag。公開用build-time変数であり
          # Secretではないため、リポジトリのActions Variables（vars）から渡す。
          # 未設定の場合はどちらも空文字列になり、既存のAND判定により安全側
          # （AI機能OFF）に倒れる（src/components/Quadratic27Detail.astro）。
          PUBLIC_AI_ENABLED: ${{ vars.PUBLIC_AI_ENABLED }}
          PUBLIC_AI_WORKER_URL: ${{ vars.PUBLIC_AI_WORKER_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
