<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="A、B、Cを円形に並べた3つの図。0度、120度、240度回転した配置で、回転によって一致するため、円順列では同じ1つとして扱う">
