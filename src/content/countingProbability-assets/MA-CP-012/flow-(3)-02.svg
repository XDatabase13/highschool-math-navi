<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" role="img" aria-label="百の位に4を固定した場合。十の位が3または5の場合と、十の位が2で一の位が1、3、5の場合に分ける。420は420より大きい整数に含まれない">
<text x="115" y="24" class="geo-side-label">百の位</text>
<text x="215" y="24" class="geo-side-label">十の位</text>
<text x="315" y="24" class="geo-side-label">一の位</text>
<text x="36" y="67" class="geo-side-label">場合1</text>
<rect x="78" y="36" width="74" height="44" fill="var(--color-surface)"/>
<rect x="78" y="36" width="74" height="44" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="78" y="36" width="74" height="44" class="pa-figure-line"/>
<text x="115" y="63" class="geo-point-label">4</text>
<rect x="178" y="36" width="74" height="44" fill="var(--color-surface)"/>
<rect x="178" y="36" width="74" height="44" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="178" y="36" width="74" height="44" class="pa-figure-line"/>
<text x="215" y="63" class="geo-point-label">3・5</text>
<rect x="278" y="36" width="74" height="44" fill="var(--color-surface)"/>
<rect x="278" y="36" width="74" height="44" class="pa-figure-line"/>
<text x="315" y="63" class="geo-point-label">残り</text>
<text x="36" y="135" class="geo-side-label">場合2</text>
<rect x="78" y="104" width="74" height="44" fill="var(--color-surface)"/>
<rect x="78" y="104" width="74" height="44" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="78" y="104" width="74" height="44" class="pa-figure-line"/>
<text x="115" y="131" class="geo-point-label">4</text>
<rect x="178" y="104" width="74" height="44" fill="var(--color-surface)"/>
<rect x="178" y="104" width="74" height="44" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="178" y="104" width="74" height="44" class="pa-figure-line"/>
<text x="215" y="131" class="geo-point-label">2</text>
<rect x="278" y="104" width="74" height="44" fill="var(--color-surface)"/>
<rect x="278" y="104" width="74" height="44" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="278" y="104" width="74" height="44" class="pa-figure-line"/>
<text x="315" y="131" class="geo-point-label">1・3・5</text>
<text x="200" y="182" class="geo-angle-label">420 は「420より大きい」に含まれない</text>
<text x="200" y="204" class="geo-side-label">（十の位が2、一の位が0の場合は除く）</text>
</svg>
