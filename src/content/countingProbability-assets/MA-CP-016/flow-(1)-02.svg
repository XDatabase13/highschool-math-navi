<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 116" role="img" aria-label="まとまりの内部がABとなる場合とBAとなる場合。AとBの入れ替えは2通り">
<rect x="80" y="30" width="76" height="40" rx="10" fill="var(--color-surface)"/>
<rect x="80" y="30" width="76" height="40" rx="10" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="80" y="30" width="76" height="40" class="pa-figure-line" rx="10"/>
<text x="102" y="55" class="geo-point-label">A</text>
<text x="134" y="55" class="geo-point-label">B</text>
<rect x="224" y="30" width="76" height="40" rx="10" fill="var(--color-surface)"/>
<rect x="224" y="30" width="76" height="40" rx="10" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="224" y="30" width="76" height="40" class="pa-figure-line" rx="10"/>
<text x="246" y="55" class="geo-point-label">B</text>
<text x="278" y="55" class="geo-point-label">A</text>
<text x="188" y="54" class="geo-side-label">と</text>
<text x="190" y="100" class="geo-angle-label">まとまりの内部の並び方は2通り</text>
</svg>
