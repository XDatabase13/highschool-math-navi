name = "highschool-math-db-ai-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ThinkingFlow単位のAI質問機能用serverless proxy。
# 現行Astro/GitHub Pages本体とは分離している。
# デフォルト（環境指定なし）はローカル開発用設定。本番は下記[env.production]を使う。

[vars]
# AI-context JSON（/ai-context/<problem_id>.json）の取得元。
# ローカル：Astro dev server。本番設定は[env.production.vars]を参照。
AI_CONTEXT_BASE_URL = "http://localhost:4321"

# AI質問機能の対象問題は、許可リストの手動管理ではなく「AI_CONTEXT_BASE_URL上に
# 対応するAI-context JSONが実在するか」で判定する（src/index.tsのfetchAiContext）。
# npm run build時に生成される162件のJSON（quadratic27 54件・trig4 41件・
# dataAnalysis 23件・expressionCalculation 44件、
# いずれもverification_status: 独立検算済みのみ）と常に1:1で一致するため、
# 問題が増減してもここを手動で更新する必要がない。

# CORSで許可するOrigin（カンマ区切り）。ローカルのAstro dev serverと、
# 将来の本番ドメインを想定する。
ALLOWED_ORIGINS = "http://localhost:4321,https://math-navi.com"

GEMINI_MODEL = "gemini-3.6-flash"

# GEMINI_API_KEYはvarsに書かない（secretとして別管理）。
# ローカル開発：worker/.dev.vars（Git管理外）にGEMINI_API_KEY=...を設定する。
# 本番：`wrangler secret put GEMINI_API_KEY --env production` で設定する。

[env.production.vars]
# 本番はAstro本番サイトが生成するAI-context JSONを参照する。
AI_CONTEXT_BASE_URL = "https://math-navi.com"

# 既存の許可Origin設定をそのまま踏襲する（ここで新規に絞り込まない）。
ALLOWED_ORIGINS = "http://localhost:4321,https://math-navi.com"

GEMINI_MODEL = "gemini-3.6-flash"
