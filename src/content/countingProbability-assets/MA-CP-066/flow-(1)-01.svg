<text x="228" y="98" class="pa-label">5</text>
<line x1="218" y1="102" x2="238" y2="102" class="pa-figure-line" stroke-width="1"/>
<text x="228" y="114" class="pa-label">10</text>
<text x="300" y="98" class="pa-label">3</text>
<line x1="290" y1="102" x2="310" y2="102" class="pa-figure-line" stroke-width="1"/>
<text x="300" y="114" class="pa-label">10</text>
<rect x="20" y="16" width="316" height="108" class="pa-figure-line" fill="none"/>
<line x1="20" y1="48" x2="336" y2="48" class="pa-figure-line"/>
<line x1="20" y1="80" x2="336" y2="80" class="pa-figure-line"/>
<line x1="120" y1="16" x2="120" y2="124" class="pa-figure-line"/>
<line x1="192" y1="16" x2="192" y2="124" class="pa-guide"/>
<line x1="264" y1="16" x2="264" y2="124" class="pa-guide"/>
