<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 226" role="img" aria-label="7人全員がA組に入りB組が空になる場合と、7人全員がB組に入りA組が空になる場合の2通りを除く。計算は2の7乗から2を引く形">
<rect x="46" y="34" width="128" height="52" fill="var(--color-surface)"/>
<rect x="46" y="34" width="128" height="52" class="pa-figure-line"/>
<text x="110" y="26" class="geo-side-label">A組</text>
<text x="110" y="64" class="geo-point-label">1〜7 全員</text>
<rect x="196" y="34" width="128" height="52" fill="var(--color-surface)"/>
<rect x="196" y="34" width="128" height="52" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="196" y="34" width="128" height="52" class="pa-figure-line"/>
<text x="260" y="26" class="geo-side-label">B組</text>
<text x="260" y="64" class="geo-angle-label">空</text>
<rect x="46" y="124" width="128" height="52" fill="var(--color-surface)"/>
<rect x="46" y="124" width="128" height="52" fill="var(--color-accent)" fill-opacity="0.3"/>
<rect x="46" y="124" width="128" height="52" class="pa-figure-line"/>
<text x="110" y="116" class="geo-side-label">A組</text>
<text x="110" y="154" class="geo-angle-label">空</text>
<rect x="196" y="124" width="128" height="52" fill="var(--color-surface)"/>
<rect x="196" y="124" width="128" height="52" class="pa-figure-line"/>
<text x="260" y="116" class="geo-side-label">B組</text>
<text x="260" y="154" class="geo-point-label">1〜7 全員</text>
<text x="372" y="64" class="geo-angle-label">除く</text>
<text x="372" y="154" class="geo-angle-label">除く</text>
<text x="210" y="212" class="geo-angle-label">除く場合は2通り：2⁷ − 2</text>
</svg>
