<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 140" role="img" aria-label="玉の色が白・黒・赤のとき、所持金の増減は＋1000円・＋200円・−600円、確率は2/10・5/10・3/10であることを示す表">
<text x="70" y="36" class="pa-label pa-table-cell-strong">玉の色</text>
<text x="156" y="36" class="pa-label">白</text>
<text x="228" y="36" class="pa-label">黒</text>
<text x="300" y="36" class="pa-label">赤</text>
<text x="70" y="68" class="pa-label pa-table-cell-strong">所持金の増減</text>
<text x="156" y="68" class="pa-label">＋1000円</text>
<text x="228" y="68" class="pa-label">＋200円</text>
<text x="300" y="68" class="pa-label">−600円</text>
<text x="70" y="106" class="pa-label pa-table-cell-strong">確率</text>
<text x="156" y="98" class="pa-label">2</text>
<line x1="146" y1="102" x2="166" y2="102" class="pa-figure-line" stroke-width="1"/>
