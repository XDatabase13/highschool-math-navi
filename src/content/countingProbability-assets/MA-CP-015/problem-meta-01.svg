<text x="140" y="74" class="pa-panel-label">＝</text>
<text x="280" y="74" class="pa-panel-label">＝</text>
<text x="70" y="138" class="geo-side-label">0°</text>
<text x="210" y="138" class="geo-side-label">120°回転</text>
<text x="350" y="138" class="geo-side-label">240°回転</text>
<text x="210" y="166" class="geo-angle-label">回転すると一致するので、円順列では同じ1つ</text>
</svg>
