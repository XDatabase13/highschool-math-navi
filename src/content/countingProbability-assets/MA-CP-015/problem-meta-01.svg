<circle cx="40.6" cy="87" r="14" fill="var(--color-surface)"/>
<circle cx="40.6" cy="87" r="14" class="pa-figure-line"/>
<text x="40.6" y="92" class="geo-point-label">C</text>
<circle cx="210" cy="70" r="34" class="pa-guide"/>
<circle cx="210" cy="36" r="14" fill="var(--color-surface)"/>
