<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" role="img" aria-label="元の命題・逆・裏・対偶を四角形の頂点に配置し、対角線で結ばれた元の命題と対偶、逆と裏の真偽が一致することを示す関係図">
<line x1="145" y1="66" x2="315" y2="66" class="pa-figure-line"/>
<line x1="145" y1="252" x2="315" y2="252" class="pa-figure-line"/>
<line x1="95" y1="90" x2="95" y2="208" class="pa-figure-line"/>
<line x1="365" y1="90" x2="365" y2="208" class="pa-figure-line"/>
<text x="230" y="58" class="pa-label">逆</text>
<text x="230" y="244" class="pa-label">逆</text>
<text x="82" y="153" class="pa-label">裏</text>
<text x="378" y="153" class="pa-label">裏</text>
<line x1="140" y1="92" x2="320" y2="206" class="pa-axis-highlight"/>
<line x1="320" y1="92" x2="140" y2="206" class="pa-axis-highlight"/>
<rect x="186" y="132" width="88" height="24" fill="var(--color-accent-bg)"/>
<text x="230" y="150" class="pa-panel-label">真偽が一致</text>
<text x="230" y="118" class="pa-label">対偶</text>

<text x="95" y="40" class="pa-panel-label">元の命題</text>
<text x="62" y="74" class="pa-label-eq">p</text>
<text x="95" y="74" class="pa-label-eq">⇒</text>
<text x="128" y="74" class="pa-label-eq">q</text>

<text x="365" y="40" class="pa-panel-label">逆</text>
<text x="332" y="74" class="pa-label-eq">q</text>
<text x="365" y="74" class="pa-label-eq">⇒</text>
<text x="398" y="74" class="pa-label-eq">p</text>

<text x="95" y="226" class="pa-panel-label">裏</text>
<line x1="56" y1="243" x2="68" y2="243" class="pa-figure-line"/>
<text x="62" y="260" class="pa-label-eq">p</text>
<text x="95" y="260" class="pa-label-eq">⇒</text>
<line x1="122" y1="243" x2="134" y2="243" class="pa-figure-line"/>
<text x="128" y="260" class="pa-label-eq">q</text>

<text x="365" y="226" class="pa-panel-label">対偶</text>
<line x1="326" y1="243" x2="338" y2="243" class="pa-figure-line"/>
<text x="332" y="260" class="pa-label-eq">q</text>
<text x="365" y="260" class="pa-label-eq">⇒</text>
<line x1="392" y1="243" x2="404" y2="243" class="pa-figure-line"/>
<text x="398" y="260" class="pa-label-eq">p</text>
</svg>
