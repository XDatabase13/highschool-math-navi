<text x="210" y="41" class="geo-point-label">C</text>
<circle cx="239.4" cy="87" r="14" fill="var(--color-surface)"/>
<circle cx="239.4" cy="87" r="14" class="pa-figure-line"/>
<text x="239.4" y="92" class="geo-point-label">A</text>
<circle cx="180.6" cy="87" r="14" fill="var(--color-surface)"/>
<circle cx="180.6" cy="87" r="14" class="pa-figure-line"/>
<text x="180.6" y="92" class="geo-point-label">B</text>
<circle cx="350" cy="70" r="34" class="pa-guide"/>
<circle cx="350" cy="36" r="14" fill="var(--color-surface)"/>
<circle cx="350" cy="36" r="14" class="pa-figure-line"/>
<text x="350" y="41" class="geo-point-label">B</text>
<circle cx="379.4" cy="87" r="14" fill="var(--color-surface)"/>
<circle cx="379.4" cy="87" r="14" class="pa-figure-line"/>
<text x="379.4" y="92" class="geo-point-label">C</text>
<circle cx="320.6" cy="87" r="14" fill="var(--color-surface)"/>
<circle cx="320.6" cy="87" r="14" class="pa-figure-line"/>
